# Star extractor — runs the SEP source extractor in "stars" mode.
# Returns star trail midpoints (plate_solver_input) only.
# Uses the same Docker image as the satellite extractor; EXTRACTOR_TYPE
# env var controls which detections are returned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: star-extractor
  namespace: observation-tools
  labels:
    app: star-extractor
    app.kubernetes.io/part-of: observation-tools
    app.kubernetes.io/component: source-extraction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: star-extractor
  template:
    metadata:
      labels:
        app: star-extractor
    spec:
      containers:
        - name: star-extractor
          image: observation-tools/source-extractor:latest
          imagePullPolicy: Never          # use locally-built image in minikube
          ports:
            - containerPort: 5002
          env:
            - name: EXTRACTOR_TYPE
              value: "stars"
            - name: PORT
              value: "5002"
            - name: WORKERS
              value: "2"
            - name: TIMEOUT
              value: "120"
          envFrom:
            - configMapRef:
                name: pipeline-config
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: star-extractor
  namespace: observation-tools
  labels:
    app: star-extractor
    app.kubernetes.io/part-of: observation-tools
spec:
  selector:
    app: star-extractor
  ports:
    - name: http
      port: 5002
      targetPort: 5002
  type: ClusterIP
