# Projection service — converts satellite pixel detections to (RA, Dec)
# using the WCS from the plate solver.  Stateless and CPU-light.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projector
  namespace: observation-tools
  labels:
    app: projector
    app.kubernetes.io/part-of: observation-tools
    app.kubernetes.io/component: projection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: projector
  template:
    metadata:
      labels:
        app: projector
    spec:
      containers:
        - name: projector
          image: observation-tools/projector:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: WORKERS
              value: "4"
            - name: TIMEOUT
              value: "30"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: projector
  namespace: observation-tools
  labels:
    app: projector
    app.kubernetes.io/part-of: observation-tools
spec:
  selector:
    app: projector
  ports:
    - name: http
      port: 5003
      targetPort: 5003
  type: ClusterIP
